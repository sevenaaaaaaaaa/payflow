name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, openssl, curl, mbstring
          coverage: none

      - name: Lint (php -l)
        run: find payflow -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Guard — 密钥/私钥文件不得入库
        run: |
          if git ls-files | grep -qiE '(^|/)secrets|\.env$|\.pem$'; then
            echo "::error::检测到敏感文件被跟踪"; exit 1
          fi

      - name: Self-test（92+ 项）
        run: php payflow/tests/run.php
